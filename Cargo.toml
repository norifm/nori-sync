[workspace]
resolver = "3"
members = ["crates/room", "crates/server", "crates/conformance"]
exclude = ["cloudflare"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
nori-sync-room = { path = "crates/room" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Checks every push and pull request; a push to main that passes is deployed to Cloudflare (sync.norifm.com).
# The deploy needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts and Workers Routes edit,
# Zone read for norifm.com) and CLOUDFLARE_ACCOUNT_ID.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: cargo fmt --all --check && (cd cloudflare && cargo fmt --check)
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cd cloudflare && cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: tools/conformance.sh self
      - run: tools/conformance.sh cloudflare

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sync.norifm.com
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: cd cloudflare && npm ci --no-audit --no-fund && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

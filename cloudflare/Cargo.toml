[package]
name = "nori-sync-cloudflare"
version = "0.1.0"
edition = "2024"
publish = false
description = "The nori sync server on Cloudflare: a Worker and one Durable Object per room"

[lib]
crate-type = ["cdylib"]

[dependencies]
nori-sync-room = { path = "../crates/room" }
# worker, worker-build (wrangler.toml) and wrangler (package.json) are pinned together.
worker = "=0.9.0"
js-sys = "0.3"
serde_bytes = "0.11"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[workspace]

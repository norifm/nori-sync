# The nori sync server on Cloudflare. Deploy with `npm ci && npx wrangler deploy` (README.md).
name = "nori-sync"
main = "build/index.js"
compatibility_date = "2026-11-20"

# The address the server answers at, a domain on the account it deploys to: nori's public server. To run
# your own, change it to a domain on your account, or remove it to answer only at
# nori-sync.<your account>.workers.dev.
routes = [{ pattern = "sync.norifm.com", custom_domain = true }]

[build]
# worker-build is pinned with the worker crate (Cargo.toml) and installed into .tools on first build.
command = "cargo install -q --locked worker-build@0.9.0 --root .tools && .tools/bin/worker-build --release"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Rooms one network address may open per minute. Cloudflare's limiter counts per location, in memory.
[[ratelimits]]
name = "NEW_ROOMS"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Refusals are logged as `refused <reason>` lines, nothing else; Workers Logs counts them.
[observability]
enabled = true

[vars]
# The limits, the same names as the self-hosted server's environment (README.md). Unset: the defaults.
# NORI_SYNC_MAX_FRAME = "65536"
# NORI_SYNC_FRAMES_PER_MINUTE = "240"
# NORI_SYNC_BYTES_PER_MINUTE = "4194304"
# NORI_SYNC_MAX_MEMBERS = "20"
# NORI_SYNC_MEETING_SECONDS = "300"
# NORI_SYNC_MEETING_CLOSED_SECONDS = "3600"
# NORI_SYNC_KEPT_SECONDS = "4838400"
# SHA-256 fingerprints of the certificates nori's Android app is signed with, for app links.
# NORI_SYNC_APP_LINK_FINGERPRINTS = "AB:CD:..."

# The conformance suite's server (tools/conformance.sh cloudflare), run only locally with `wrangler dev`.
[env.test]
name = "nori-sync-test"

[[env.test.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.test.ratelimits]]
name = "NEW_ROOMS"
namespace_id = "1002"
simple = { limit = 100, period = 60 }

[env.test.vars]
NORI_SYNC_FRAMES_PER_MINUTE = "30"
NORI_SYNC_MEETING_SECONDS = "4"
NORI_SYNC_MEETING_CLOSED_SECONDS = "4"
NORI_SYNC_KEPT_SECONDS = "3"
NORI_SYNC_MAX_MEMBERS = "5"
NORI_SYNC_DEBUG_EVENTS = "1"
